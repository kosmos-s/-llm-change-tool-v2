[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-change-tool"
version = "0.1.0a0"
description = "Local-first desktop tool for LLM-assisted aerial-image change-detection data curation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "PySide6>=6.7,<7",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "pydantic>=2.8,<3",
  "platformdirs>=4.2,<5",
  "openai>=1.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-qt>=4.4,<5",
]

[project.scripts]
llm-change-tool = "llm_change_tool.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_change_tool = [
  "resources/label_schemas/*.json",
  "resources/prompts/*.txt",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
